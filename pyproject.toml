[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopguard"
version = "0.1.0"
description = "Catches AI-hallucinated ('slopsquatted') packages before you install them."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
slopguard = "slopguard.cli:main"

[tool.setuptools.packages.find]
include = ["slopguard*"]
