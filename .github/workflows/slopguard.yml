name: slopguard

on: [pull_request]

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install slopguard
        run: pip install slopguard
      - name: Check for hallucinated packages
        run: slopguard .
